name: PrimeSphere Cloudflare Auto Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: primesphere-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Trades privacy
        run: node scripts/validate-trades-public.mjs
      - name: Typecheck and build
        run: npm run build
      - name: Verify compiled site
        run: test -s dist/client/index.html
      - name: Deploy Cloudflare Worker and static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test public site
        if: ${{ vars.PRIMESPHERE_SITE_URL != '' }}
        env:
          SITE_URL: ${{ vars.PRIMESPHERE_SITE_URL }}
        run: |
          curl --fail --location --retry 5 --retry-delay 5 --max-time 30 "$SITE_URL" -o /tmp/primesphere.html
          grep -qi '<html' /tmp/primesphere.html
