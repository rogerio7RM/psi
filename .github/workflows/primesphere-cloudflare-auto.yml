name: PrimeSphere Cloudflare Auto Deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - '.trades-sync/**'
      - '.github/workflows/instagram-staging.yml'
      # production deploy trigger refreshed 2026-10-05
  workflow_dispatch:
concurrency:
  group: primesphere-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Trades privacy
        run: node scripts/validate-trades-public.mjs
      - name: Typecheck and build
        run: npm run build
      - name: Verify compiled site and latest editorial edition
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/client/index.html
          latest_date=$(find src/react-app/editions -maxdepth 1 -type f -printf '%f\n' | sed -nE 's/^([0-9]{6})(-afterclose|-final)?\.tsx$/\1/p' | sort | tail -1)
          test -n "$latest_date"
          if test -f "src/react-app/editions/${latest_date}-afterclose.json"; then
            latest_file="${latest_date}-afterclose.json"
            expected_label='After Close'
            node scripts/validate-editorial.mjs "src/react-app/editions/$latest_file"
          elif test -f "src/react-app/editions/${latest_date}.json"; then
            latest_file="${latest_date}.json"
            expected_label='Morning Brief'
            node scripts/validate-editorial.mjs "src/react-app/editions/$latest_file"
          elif test -f "src/react-app/editions/${latest_date}-afterclose.tsx"; then
            latest_file="${latest_date}-afterclose.tsx"
            expected_label='AFTER CLOSE'
          elif test -f "src/react-app/editions/${latest_date}-final.tsx"; then
            latest_file="${latest_date}-final.tsx"
            expected_label='FINAL PRÉ-MARKET'
          else
            latest_file="${latest_date}.tsx"
            expected_label='Morning Brief'
          fi
          test -s "src/react-app/editions/$latest_file"
          grep -qi "$expected_label" "src/react-app/editions/$latest_file"
          echo "LATEST_EDITION=$latest_date" >> "$GITHUB_ENV"
          echo "LATEST_EDITION_FILE=$latest_file" >> "$GITHUB_ENV"
          echo "EXPECTED_EDITION_LABEL=$expected_label" >> "$GITHUB_ENV"
          echo "Latest editorial edition: $latest_file ($expected_label)"
      - name: Deploy Cloudflare Worker and static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test public site, latest edition, login gates and protected content
        env:
          SITE_URL: https://primesphereintelligence.com
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --max-time 30 "$SITE_URL" -o /tmp/primesphere.html
          grep -qi '<html' /tmp/primesphere.html
          chrome=$(command -v google-chrome || command -v chromium)
          test -n "$chrome"
          published=0
          for attempt in {1..8}; do
            if timeout 55s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom "$SITE_URL/?date=$LATEST_EDITION" > /tmp/primesphere-rendered.html 2>/tmp/chrome.log; then
              if grep -qi "$EXPECTED_EDITION_LABEL" /tmp/primesphere-rendered.html; then
                published=1
                break
              fi
            fi
            sleep 5
          done
          test "$published" = '1'
          year="20${LATEST_EDITION:0:2}"
          month="${LATEST_EDITION:2:2}"
          day_num=$((10#${LATEST_EDITION:4:2}))
          case "$month" in
            01) month_name='janeiro' ;; 02) month_name='fevereiro' ;; 03) month_name='março' ;;
            04) month_name='abril' ;; 05) month_name='maio' ;; 06) month_name='junho' ;;
            07) month_name='julho' ;; 08) month_name='agosto' ;; 09) month_name='setembro' ;;
            10) month_name='outubro' ;; 11) month_name='novembro' ;; 12) month_name='dezembro' ;;
          esac
          expected_date="$day_num de $month_name de $year"
          grep -q "$expected_date" /tmp/primesphere-rendered.html
          echo "Public edition confirmed: $LATEST_EDITION_FILE ($EXPECTED_EDITION_LABEL)"
          curl --fail --silent "$SITE_URL/api/auth/me" -o /tmp/auth.json
          grep -q '"configured":true' /tmp/auth.json
          ok=0
          for attempt in {1..6}; do
            if timeout 55s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom "$SITE_URL/trades" > /tmp/trades.html 2>/tmp/chrome-subscriber.log; then
              if grep -q 'Trading Logbook' /tmp/trades.html && grep -q 'PÚBLICO · RM' /tmp/trades.html; then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = '1'
          ! grep -Eq 'Área de assinantes|Criar administrador' /tmp/trades.html
          ok=0
          for attempt in {1..6}; do
            if timeout 55s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom "$SITE_URL/educacional" > /tmp/educacional.html 2>/tmp/chrome-subscriber.log; then
              if grep -Eq 'Área de assinantes|Criar administrador' /tmp/educacional.html; then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = '1'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/content/trades/rm")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/content/trades/eb")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/content/trades/dc")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/data/trades.json")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/data/trades-eb.json")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/data/trades-dc.json")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/estudos/matematica-zero-dte/estudo-0-dte.pdf")" = "401"
          echo 'Public RM and subscriber-only private Trades confirmed.'
