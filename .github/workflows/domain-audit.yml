name: Auditoria de dominio PrimeSphere

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Diagnosticar DNS publico e redirecionamento WWW
        shell: bash
        run: |
          set +e
          echo '=== NS publico e DNS autoritativo ==='
          dig +time=3 +tries=1 +short NS primesphereintelligence.com @1.1.1.1
          for ns in leanna.ns.cloudflare.com mustafa.ns.cloudflare.com; do
            echo "===== AUTHORITATIVE: $ns ====="
            for host in primesphereintelligence.com www.primesphereintelligence.com; do
              echo "HOST: $host"
              dig +time=3 +tries=1 @"$ns" "$host" A +noall +comments +answer
              dig +time=3 +tries=1 @"$ns" "$host" AAAA +noall +comments +answer
            done
          done
          for resolver in 1.1.1.1 8.8.8.8; do
            echo "===== RECURSIVE: $resolver ====="
            for host in primesphereintelligence.com www.primesphereintelligence.com; do
              echo "HOST: $host"
              dig +time=3 +tries=1 @"$resolver" "$host" A +noall +comments +answer
              dig +time=3 +tries=1 @"$resolver" "$host" AAAA +noall +comments +answer
            done
          done
          echo '=== HTTPS sem seguir redirects ==='
          for url in 'https://primesphereintelligence.com/?260925' 'https://www.primesphereintelligence.com/?260925' 'https://primesphere-intelligence.rogerio7.workers.dev/?260925'; do
            echo "URL: $url"
            curl -sS -I --connect-timeout 7 --max-time 12 "$url" | sed -n '1,25p'
            echo "curl_exit: ${PIPESTATUS[0]}"
          done
          echo '=== HTTPS seguindo redirects ==='
          for url in 'https://primesphereintelligence.com/?260925' 'https://www.primesphereintelligence.com/?260925'; do
            echo "URL: $url"
            curl -sS -L --max-redirs 6 --connect-timeout 7 --max-time 18 -o /dev/null -w 'HTTP=%{http_code} final=%{url_effective} redirects=%{num_redirects} TLS=%{ssl_verify_result}\n' "$url"
          done
