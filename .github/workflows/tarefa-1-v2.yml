name: Tarefa 1 V2 - Morning Brief
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar a edicao? Deixe false para apenas validar a configuracao sem chamar APIs.'
        type: boolean
        required: true
        default: false
concurrency:
  group: tarefa-1-v2
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check isolated editorial configuration without exposing credentials
        env:
          BIGDATA_READY: ${{ secrets.BIGDATA_EDITORIAL_API_KEY != '' }}
          OPENAI_READY: ${{ secrets.OPENAI_EDITORIAL_API_KEY != '' }}
          AUTOMATION_ENABLED: ${{ vars.PRIME_EDITORIAL_AUTOMATION_ENABLED }}
        shell: bash
        run: |
          echo "Bigdata editorial credential configured: $BIGDATA_READY"
          echo "OpenAI editorial credential configured: $OPENAI_READY"
          echo "Automatic publication enabled: ${AUTOMATION_ENABLED:-false}"
          if [[ "$BIGDATA_READY" != "true" || "$OPENAI_READY" != "true" ]]; then
            echo "::notice::Add both dedicated editorial secrets before enabling publication."
          fi
  morning:
    needs: readiness
    if: ${{ (github.event_name == 'schedule' && vars.PRIME_EDITORIAL_AUTOMATION_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Require dedicated editorial credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_EDITORIAL_API_KEY }}
          BIGDATA_API_KEY: ${{ secrets.BIGDATA_EDITORIAL_API_KEY }}
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_EDITORIAL_API_KEY missing"; exit 1; }
          test -n "$BIGDATA_API_KEY" || { echo "::error::BIGDATA_EDITORIAL_API_KEY missing"; exit 1; }
      - name: Generate Morning Brief from Bigdata
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_EDITORIAL_API_KEY }}
          BIGDATA_API_KEY: ${{ secrets.BIGDATA_EDITORIAL_API_KEY }}
        run: node scripts/generate-editorial-v2.mjs morning
      - name: Validate edition
        shell: bash
        run: |
          code=$(TZ=Europe/Madrid date +%y%m%d)
          node scripts/validate-editorial.mjs "src/react-app/editions/$code.json"
          npm run build
      - name: Commit validated edition
        shell: bash
        run: |
          code=$(TZ=Europe/Madrid date +%y%m%d)
          git config user.name "PrimeSphere Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "src/react-app/editions/$code.json"
          git diff --cached --quiet && exit 0
          git commit -m "Publish Morning Brief V2 $code"
          git pull --rebase origin main
          git push origin HEAD:main
