name: PrimeSphere Morning Brief - Recover Without Bigdata
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Failed Morning Brief run ID containing archived artifacts'
        required: true
        type: string
      edition_date:
        description: 'Edition date YYMMDD, matching archived files'
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: morning-edition-recovery
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: morning-bigdata-research
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - run: npm ci
      - name: Validate archived edition without new research
        run: |
          $date = '${{ inputs.edition_date }}'
          if ($date -notmatch '^26[0-9]{4}$') { throw 'Invalid edition date' }
          $path = "src/react-app/editions/$date.json"
          $research = "editorial-audit/$date-bigdata-research.json"
          if (-not (Test-Path $path)) { throw "Missing archived edition $path" }
          if (-not (Test-Path $research)) { throw "Missing archived research $research" }
          node scripts/fix-editorial-encoding.mjs $path --write
          if ($LASTEXITCODE -ne 0) { throw 'Encoding failed' }
          node scripts/validate-editorial.mjs $path
          if ($LASTEXITCODE -ne 0) { throw 'Editorial validation failed; inspect the edition before publishing' }
          node scripts/audit-bigdata-edition.mjs $path $research
          if ($LASTEXITCODE -ne 0) { throw 'Factual audit failed' }
          node scripts/check-live-edition.mjs $path morning
          if ($LASTEXITCODE -ne 0) { throw 'Live audit failed' }
          node scripts/format-morning-golden.mjs $path
          if ($LASTEXITCODE -ne 0) { throw 'Golden format failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          "EDITION_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Commit recovered edition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $env:EDITION_PATH
          if (-not (git diff --cached --quiet)) {
            git commit -m "Recover validated Morning Brief: $env:EDITION_PATH"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Git push failed' }
          }
      - name: Trigger Cloudflare deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/primesphere-cloudflare-auto.yml/dispatches" -Headers $headers -Body '{"ref":"main"}' -ContentType "application/json"
