name: PrimeSphere Morning Brief - Auto Website
on:
  schedule:
    - cron: '0 11 * * 1-5' # 12:00 Europe/Madrid in winter (UTC+1)
  workflow_dispatch:
    inputs:
      reuse_existing_research:
        description: 'Reuse saved research from runner (no Bigdata charge)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: primesphere-morning-editorial
  cancel-in-progress: false
jobs:
  publish-morning:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 100
    defaults:
      run:
        shell: powershell
    env:
      EDITORIAL_PROVIDER: ollama
      EDITORIAL_STRICT_QA: 'true'
      OLLAMA_MODEL: qwen2.5:7b
      OLLAMA_URL: http://127.0.0.1:11434
      BIGDATA_API_KEY: ${{ secrets.BIGDATA_API_KEY }}
      BIGDATA_PAID_RESEARCH_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require configured Bigdata API key
        run: |
          if (-not $env:BIGDATA_API_KEY) { throw 'BIGDATA_API_KEY is not configured.' }
      - name: Check local Ollama
        run: |
          $models = Invoke-RestMethod -Uri "$env:OLLAMA_URL/api/tags" -TimeoutSec 30
          if (-not ($models.models | Where-Object { $_.name -eq $env:OLLAMA_MODEL })) { throw 'Ollama model unavailable' }
      - run: npm ci
      - name: Generate and validate Morning Brief
        run: |
          $code = node -e "const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'2-digit',month:'2-digit',day:'2-digit'}).formatToParts(new Date()); console.log(['year','month','day'].map(k=>p.find(x=>x.type===k).value).join(''))"
          $savedResearch = "editorial-audit/$code-bigdata-research.json"
          if ('${{ inputs.reuse_existing_research }}' -eq 'true') {
            if (-not (Test-Path $savedResearch)) { throw "Saved research not found: $savedResearch" }
            $env:EDITORIAL_RESEARCH_FILE = $savedResearch
            Write-Host "Reusing saved research: $savedResearch"
          }
          node scripts/generate-editorial-v2.mjs morning
          if ($LASTEXITCODE -ne 0) { throw 'Generation failed' }
          $code = node -e "const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'2-digit',month:'2-digit',day:'2-digit'}).formatToParts(new Date()); console.log(['year','month','day'].map(k=>p.find(x=>x.type===k).value).join(''))"
          $path = "src/react-app/editions/$code.json"
          if (-not (Test-Path $path)) { throw "Generated edition missing: $path" }
          $research = "editorial-audit/$code-bigdata-research.json"
          if (-not (Test-Path $research)) { throw "Bigdata research audit file missing: $research" }
          node scripts/fix-editorial-encoding.mjs $path --write
          if ($LASTEXITCODE -ne 0) { throw 'Editorial UTF-8 repair failed; publication blocked' }
          node scripts/validate-editorial.mjs $path
          if ($LASTEXITCODE -ne 0) { throw 'Editorial QA failed after repair' }
          node scripts/audit-bigdata-edition.mjs $path $research
          if ($LASTEXITCODE -ne 0) { throw 'Bigdata factual audit failed after repair' }
          node scripts/check-live-edition.mjs $path morning
          if ($LASTEXITCODE -ne 0) { throw 'Live edition QA failed' }
          node scripts/format-morning-golden.mjs $path
          if ($LASTEXITCODE -ne 0) { throw 'Golden editorial formatting failed' }
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); console.log('Final edition JSON valid')" $path
          if ($LASTEXITCODE -ne 0) { throw 'Final JSON invalid; publication blocked' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          "EDITION_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Preserve generated edition for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-edition-recovery
          path: src/react-app/editions/26*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Archive Bigdata research for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-bigdata-research
          path: editorial-audit/*-bigdata-research.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit validated edition and trigger site deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $env:EDITION_PATH
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish validated Morning Brief: $env:EDITION_PATH"
            git -c http.extraheader="AUTHORIZATION: basic $([Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")))" push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Git push failed; edition not published' }
            Write-Host 'Edition pushed to main. Dispatching Cloudflare deployment explicitly.'
          } else { Write-Host 'No changes to publish' }
      - name: Trigger Cloudflare deploy via GitHub API
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/primesphere-cloudflare-auto.yml/dispatches"
          $body = '{"ref":"main"}'
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -Body $body -ContentType "application/json" -TimeoutSec 30
          Write-Host 'Cloudflare deployment dispatched through GitHub API.'
