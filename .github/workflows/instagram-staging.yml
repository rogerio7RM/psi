name: PrimeSphere Social Pipeline

on:
  workflow_run:
    workflows: ["PrimeSphere Cloudflare Auto Deploy"]
    types: [completed]
  push:
    branches: ["main"]
    paths: [".github/workflows/instagram-staging.yml"]
  workflow_dispatch:
    inputs:
      edition:
        description: "Optional YYYY-MM-DD; blank = latest Morning Brief"
        required: false
        default: ""
      force_republish:
        description: "Explicit correction republish; manual use only"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: primesphere-social
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      edition: ${{ steps.resolve.outputs.edition }}
      force: ${{ steps.resolve.outputs.force }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: resolve
        shell: bash
        env:
          INPUT_EDITION: ${{ inputs.edition }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_EDITION:-}" ]; then
            edition="$INPUT_EDITION"
          else
            file=$(find src/react-app/editions -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{6}\.tsx' -printf '%f\n' | sort | tail -1)
            test -n "$file"
            code="${file%.tsx}"
            edition="20${code:0:2}-${code:2:2}-${code:4:2}"
          fi
          grep -q "Morning Brief" "src/react-app/editions/${edition:2:2}${edition:5:2}${edition:8:2}.tsx"
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          force=false
          if [ -f ".social-force-republish" ] && grep -qx "$edition" ".social-force-republish"; then force=true; fi
          echo "force=$force" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Generate today social JSON from Morning Brief
        env:
          EDITION: ${{ steps.resolve.outputs.edition }}
        run: |
          code="${EDITION:2:2}${EDITION:5:2}${EDITION:8:2}"
          node scripts/generate-social-edition.mjs "src/react-app/editions/$code.tsx" ".social/$EDITION.json"
      - run: npm install --no-save --package-lock=false sharp
      - uses: actions/upload-artifact@v4
        with:
          name: social-assets-${{ steps.resolve.outputs.edition }}
          path: |
            .social/*.json
          include-hidden-files: true
          retention-days: 7

  stage:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with:
          name: social-assets-${{ needs.prepare.outputs.edition }}
          path: social-assets
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-save --package-lock=false sharp
      - name: Fetch approved backgrounds, render and strict QA
        env:
          BASE_URL: https://primesphereintelligence.com
          PUBLISH_ADMIN_KEY: ${{ secrets.PUBLISH_ADMIN_KEY }}
          EDITION: ${{ needs.prepare.outputs.edition }}
        run: |
          mkdir -p social-assets/backgrounds social-assets/cards
          node <<'NODE'
          const fs=require("fs"),d=JSON.parse(fs.readFileSync("social-assets/"+process.env.EDITION+".json","utf8"));
          (async()=>{for(const card of d.cards){const n=String(card.background).padStart(2,"0");const r=await fetch(process.env.BASE_URL+"/api/publisher/background/"+card.background,{headers:{"X-Publisher-Key":process.env.PUBLISH_ADMIN_KEY}});if(!r.ok)throw Error("background "+n+" HTTP "+r.status);fs.writeFileSync("social-assets/backgrounds/background_"+n+".png",Buffer.from(await r.arrayBuffer()));}})().catch(e=>{console.error(e.message);process.exit(1)})
          NODE
          node scripts/render-instagram-cards.mjs "social-assets/$EDITION.json" social-assets/backgrounds social-assets/cards
          python3 - <<'PY'
          import glob,struct
          files=sorted(glob.glob("social-assets/cards/card_*.png"))
          assert len(files)==8
          assert [p.rsplit('/',1)[-1] for p in files]==[f"card_{i:02d}.png" for i in range(1,9)]
          for p in files:
            b=open(p,"rb").read(24)
            assert b[:8]==b"\\x89PNG\\r\\n\\x1a\\n"
            assert struct.unpack(">II",b[16:24])==(1080,1350)
          import json
          q=json.load(open("social-assets/cards/qa.json"))
          assert q["passed"] is True and q["templateVersion"]=="primesphere-approved-v2"
          assert q["slides"]==8 and q["width"]==1080 and q["height"]==1350
          assert q["minBodyFont"]>=28 and q["minTableFont"]>=22
          assert q["slide2Columns"]==["Ticker","Preço (US$)","Variação","Leitura"] and q["slide2Rows"]==10
          assert q["marketPulseBlocks"]==3
          print("HARD QA PASS: approved visual/content contract + 8 PNGs 1080x1350")
          PY
      - name: Stage validated assets and caption
        env:
          BASE_URL: https://primesphereintelligence.com
          PUBLISH_ADMIN_KEY: ${{ secrets.PUBLISH_ADMIN_KEY }}
          EDITION: ${{ needs.prepare.outputs.edition }}
        run: |
          node <<'NODE'
          const fs=require("fs"),d=JSON.parse(fs.readFileSync("social-assets/"+process.env.EDITION+".json","utf8")),base=process.env.BASE_URL,key=process.env.PUBLISH_ADMIN_KEY;
          (async()=>{for(let i=1;i<=8;i++){const n=String(i).padStart(2,"0"),b=fs.readFileSync("social-assets/cards/card_"+n+".png");const r=await fetch(base+"/api/publisher/media/"+d.edition+"/card_"+n+".png",{method:"POST",headers:{"X-Publisher-Key":key,"Content-Type":"image/png"},body:b});if(!r.ok)throw Error("upload "+n+" HTTP "+r.status)}
          const m=await fetch(base+"/api/publisher/instagram/edition/"+d.edition,{method:"POST",headers:{"X-Publisher-Key":key,"Content-Type":"application/json"},body:JSON.stringify({caption:d.caption,approved:true})});if(!m.ok)throw Error("manifest HTTP "+m.status);
          const s=await fetch(base+"/api/publisher/instagram/edition/"+d.edition,{headers:{"X-Publisher-Key":key}});const j=await s.json();console.log(JSON.stringify({ready:j.ready,approved:j.approved,missingCards:j.missingCards,alreadyPublished:j.alreadyPublished}));if(j.missingCards?.length||j.approved!==true)process.exit(1)})().catch(e=>{console.error(e.message);process.exit(1)})
          NODE

  instagram:
    needs: [prepare, stage]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Instagram independent publish
        env:
          BASE_URL: https://primesphereintelligence.com
          PUBLISH_ADMIN_KEY: ${{ secrets.PUBLISH_ADMIN_KEY }}
          EDITION: ${{ needs.prepare.outputs.edition }}
          FORCE_REPUBLISH: ${{ needs.prepare.outputs.force == 'true' || inputs.force_republish || false }}
        run: |
          node <<'NODE'
          const b=process.env.BASE_URL,k=process.env.PUBLISH_ADMIN_KEY,e=process.env.EDITION,h={"X-Publisher-Key":k,"Content-Type":"application/json"},force=process.env.FORCE_REPUBLISH==="true";
          (async()=>{let r=await fetch(b+"/api/publisher/instagram/status",{headers:h}),j=await r.json();if(!r.ok||!j.configured||!j.authorized||!j.idMatches)throw Error("Instagram authorization failed");
          r=await fetch(b+"/api/publisher/instagram/edition/"+e,{headers:h});j=await r.json();if(j.alreadyPublished&&!force){console.log("Instagram SKIPPED already published");return}if(!j.ready&&!force)throw Error("Instagram edition not ready");
          r=await fetch(b+"/api/publisher/instagram/publish/"+e,{method:"POST",headers:h,body:JSON.stringify(force?{confirmRepublish:true,correctionReason:"visual-qa-correction"}:{})});j=await r.json();console.log("Instagram",JSON.stringify(j));if(!r.ok||!j.published||!j.mediaId){if(j.reason==="Equivalent Instagram edition already exists; publication blocked"){console.log("Instagram SKIPPED equivalent edition already exists");return}throw Error(j.reason||"Instagram failed")}})().catch(e=>{console.error(e.message);process.exit(1)})
          NODE

  facebook:
    needs: [prepare, stage]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Facebook independent publish
        env:
          BASE_URL: https://primesphereintelligence.com
          PUBLISH_ADMIN_KEY: ${{ secrets.PUBLISH_ADMIN_KEY }}
          EDITION: ${{ needs.prepare.outputs.edition }}
          FORCE_REPUBLISH: ${{ needs.prepare.outputs.force == 'true' || inputs.force_republish || false }}
        run: |
          node <<'NODE'
          const b=process.env.BASE_URL,k=process.env.PUBLISH_ADMIN_KEY,e=process.env.EDITION,h={"X-Publisher-Key":k,"Content-Type":"application/json"},force=process.env.FORCE_REPUBLISH==="true";
          (async()=>{let r=await fetch(b+"/api/publisher/facebook/status",{headers:h}),j=await r.json();console.log("Facebook status",JSON.stringify(j));if(!r.ok||!j.configured||!j.authorized||!j.idMatches||!j.tokenActsAsPage)throw Error("Facebook authorization failed");
          r=await fetch(b+"/api/publisher/facebook/edition/"+e,{headers:h});j=await r.json();if(j.alreadyPublished&&!force){console.log("Facebook SKIPPED already published");return}if(!j.ready&&!force)throw Error("Facebook edition not ready");
          r=await fetch(b+"/api/publisher/facebook/publish/"+e,{method:"POST",headers:h,body:JSON.stringify(force?{confirmPublish:true,confirmRepublish:true,correctionReason:"visual-qa-correction"}:{confirmPublish:true})});j=await r.json();console.log("Facebook",JSON.stringify(j));if(!r.ok||!j.published||!j.postId)throw Error(j.reason||"Facebook failed")})().catch(e=>{console.error(e.message);process.exit(1)})
          NODE
