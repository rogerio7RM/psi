name: Validate Social Pipeline (dry run)
on:
  push:
    branches: ["fix/social-pipeline-autonomous"]
    paths: [".github/workflows/social-pipeline-dry-run.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false sharp
      - id: e
        shell: bash
        run: |
          file=$(find content/instagram -maxdepth 1 -type f -name '20??-??-??.json' | sort | tail -1)
          test -n "$file"
          echo "edition=$(basename "$file" .json)" >> "$GITHUB_OUTPUT"
      - name: Fetch approved backgrounds
        env:
          BASE_URL: https://primesphereintelligence.com
          PUBLISH_ADMIN_KEY: ${{ secrets.PUBLISH_ADMIN_KEY }}
          EDITION: ${{ steps.e.outputs.edition }}
        run: |
          test -n "$PUBLISH_ADMIN_KEY"
          mkdir -p .dry/backgrounds .dry/cards
          node <<'NODE'
          const fs=require("fs"),d=require("./content/instagram/"+process.env.EDITION+".json");
          (async()=>{for(const c of d.cards){const n=String(c.background).padStart(2,"0"),r=await fetch(process.env.BASE_URL+"/api/publisher/background/"+c.background,{headers:{"X-Publisher-Key":process.env.PUBLISH_ADMIN_KEY}});if(!r.ok)throw Error("background "+n+" HTTP "+r.status);fs.writeFileSync(".dry/backgrounds/background_"+n+".png",Buffer.from(await r.arrayBuffer()))}})().catch(e=>{console.error(e.message);process.exit(1)})
          NODE
      - name: Render and QA only
        env:
          EDITION: ${{ steps.e.outputs.edition }}
        run: |
          node scripts/render-instagram-cards.mjs "content/instagram/$EDITION.json" .dry/backgrounds .dry/cards
          python3 - <<'PY'
          import glob,struct
          f=sorted(glob.glob(".dry/cards/card_*.png")); assert len(f)==8
          for p in f:
            b=open(p,"rb").read(24); assert b[:8]==b"\x89PNG\r\n\x1a\n"; assert struct.unpack(">II",b[16:24])==(1080,1350)
          print("DRY RUN PASS: 8 PNGs 1080x1350; no staging; no publishing")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: social-dry-run-${{ steps.e.outputs.edition }}
          path: .dry/cards/*.png
          retention-days: 3
