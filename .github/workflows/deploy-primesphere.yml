name: Publicar PrimeSphere (manual)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: primesphere-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Trades data contract
        run: node scripts/validate-trades-public.mjs
      - name: Typecheck, build and Worker dry-run
        run: npm run check
      - name: Deploy Cloudflare Worker and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify production access control
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL='https://primesphereintelligence.com'
          curl --fail --location --retry 5 --retry-delay 5 "$SITE_URL" -o /tmp/home.html
          grep -qi '<html' /tmp/home.html
          curl --fail --silent "$SITE_URL/api/auth/me" -o /tmp/auth.json
          grep -q '"configured":true' /tmp/auth.json

          for protected in /data/trades.json /data/trades-eb.json /data/trades-dc.json /estudos/matematica-zero-dte/estudo-0-dte.pdf; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$protected")"
            test "$code" = '401'
          done

          chrome=$(command -v google-chrome || command -v chromium)
          for route in /trades /trades/EB /trades/DC /educacional; do
            safe=$(echo "$route" | tr '/' '_')
            timeout 55s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom "$SITE_URL$route" > "/tmp/$safe.html"
            grep -Eq 'Área de assinantes|Criar administrador' "/tmp/$safe.html"
          done

          echo 'PrimeSphere deployed with subscriber access controls enabled.'
