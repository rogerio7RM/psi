name: Publicar PrimeSphere (manual)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: primesphere-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Trades data contract
        run: node scripts/validate-trades-public.mjs
      - name: Typecheck, build and Worker dry-run
        run: npm run check
      - name: Deploy Cloudflare Worker and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify production access control
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL='https://primesphereintelligence.com'
          curl --fail --location --retry 5 --retry-delay 5 "$SITE_URL" -o /tmp/home.html
          grep -qi '<html' /tmp/home.html
          curl --fail --silent "$SITE_URL/api/auth/me" -o /tmp/auth.json
          grep -q '"configured":true' /tmp/auth.json

          for protected in /data/trades.json /data/trades-eb.json /data/trades-dc.json /estudos/matematica-zero-dte/estudo-0-dte.pdf; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$protected")"
            test "$code" = '401'
          done

          chrome=$(command -v google-chrome || command -v chromium)
          for route in /trades /educacional; do
            safe=$(echo "$route" | tr '/' '_')
            echo "::group::Verify protected route $route"
            if ! timeout 55s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-features=UseDBus --virtual-time-budget=5000 --dump-dom "$SITE_URL$route" > "/tmp/$safe.html" 2>"/tmp/$safe.stderr"; then
              echo "::error::Chrome failed while rendering $route"
              tail -n 12 "/tmp/$safe.stderr" || true
              exit 1
            fi
            if [[ "$route" == '/trades' ]]; then
              expected='Trades|PÚBLICO|Registro de operações'
            else
              expected='Área de assinantes|Criar administrador'
            fi
            if ! grep -Eq "$expected" "/tmp/$safe.html"; then
              echo "::error::Expected route content missing for $route (pattern: $expected)"
              echo "Rendered DOM excerpt:"
              head -c 1200 "/tmp/$safe.html" || true
              exit 1
            fi
            echo "::endgroup::"
          done

          echo "::group::Verify historical Morning Brief test route"
          if ! timeout 55s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-features=UseDBus --virtual-time-budget=5000 --dump-dom "$SITE_URL/teste-editorial" > /tmp/teste-editorial.html 2>/tmp/teste-editorial.stderr; then
            echo "::error::Chrome failed on /teste-editorial"
            tail -n 12 /tmp/teste-editorial.stderr || true
            exit 1
          fi
          for marker in 'TESTE HISTÓRICO' 'Market Pulse' 'Premarket Movers' 'Fontes e método'; do
            if ! grep -Fq "$marker" /tmp/teste-editorial.html; then
              echo "::error::Historical Morning Brief missing expected marker: $marker"
              exit 1
            fi
          done
          echo "::endgroup::"

          echo 'PrimeSphere deployed with subscriber access controls enabled.'
