name: Validar PrimeSphere (sem publicar)

on:
  push:
    branches: [main, migration/primesphere-vite-wrangler]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Atualizar lockfile para dependências do site
        run: npm ci --no-audit --no-fund
      - name: Build completo e deploy dry-run
        run: npm run check
      - name: Testar artefatos
        run: |
          test -f dist/client/index.html
          grep -q 'assets/' dist/client/index.html
          test -f src/react-app/editions/260925-afterclose.tsx
      - name: Verificar renderização real no Chrome
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/primesphere-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = '1' || { cat /tmp/primesphere-preview.log; exit 1; }
          chrome=$(command -v google-chrome || command -v chromium || true)
          test -n "$chrome" || { echo 'Chrome nao disponivel no runner'; exit 1; }
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/' >/tmp/prime-latest.html
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/?date=260917' >/tmp/prime-history.html
          grep -q 'AFTER CLOSE' /tmp/prime-latest.html
          grep -q '17/09/2026' /tmp/prime-history.html
          echo 'Testar menu e paginas internas com Chrome'
          curl --silent --fail http://127.0.0.1:4173/primesphere-logo.jpg -o /tmp/psi-logo.jpg
          test $(wc -c </tmp/psi-logo.jpg) -gt 10000
          grep -q '/quem-somos' /tmp/prime-latest.html
          grep -q '/educacional' /tmp/prime-latest.html
          grep -q '/trades' /tmp/prime-latest.html
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/quem-somos' >/tmp/quem-somos.html
          grep -q 'Conteúdo em preparação' /tmp/quem-somos.html
          grep -q 'Voltar ao Brief Atual' /tmp/quem-somos.html
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/trades' >/tmp/trades.html
          grep -q 'Trading Logbook' /tmp/trades.html
          grep -q 'Filtrar por período' /tmp/trades.html
          grep -q 'Limpar período' /tmp/trades.html
          test $(wc -c </tmp/trades.html) -gt 1000
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4500 --dump-dom 'http://127.0.0.1:4173/educacional' > /tmp/educacional.html
          grep -q 'Biblioteca de estudos' /tmp/educacional.html
          grep -q 'A Matemática do Zero DTE' /tmp/educacional.html
          grep -q 'Índice de páginas' /tmp/educacional.html
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=4500 --dump-dom 'http://127.0.0.1:4173/educacional/matematica-zero-dte' > /tmp/educacional-mobile.html
          grep -q 'A Matemática do Zero DTE' /tmp/educacional-mobile.html
          curl -fsSL 'http://127.0.0.1:4173/estudos/matematica-zero-dte/estudo-0-dte.pdf' -o /tmp/educacional-study.pdf
          test "$(head -c 5 /tmp/educacional-study.pdf)" = '%PDF-'
          for n in {01..10}; do
            curl -fsSL "http://127.0.0.1:4173/estudos/matematica-zero-dte/slide-$n.webp" -o "/tmp/educacional-$n.webp"
            test $(wc -c <"/tmp/educacional-$n.webp") -gt 40000
          done
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/' > /tmp/prime-mobile.html
          grep -q 'Abrir menu' /tmp/prime-mobile.html
          grep -q 'Wall Street, com contexto' /tmp/prime-mobile.html
          echo 'Verificar segundo estudo: 12 paginas e PDF'
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4500 --dump-dom 'http://127.0.0.1:4173/educacional/analise-quantitativa-put-spreads-0-dte' > /tmp/educacional-study2.html
          grep -q 'Análise Quantitativa de Put Spreads 0 DTE' /tmp/educacional-study2.html
          grep -q 'PÁGINA 01 / 12' /tmp/educacional-study2.html
          grep -q 'Análise Quantitativa de Put Spreads 0 DTE' /tmp/educacional.html
          curl -fsSL 'http://127.0.0.1:4173/estudos/analise-quantitativa-put-spreads-0-dte/estudo-put-spreads-0-dte.pdf' -o /tmp/educacional-study2.pdf
          test $(wc -c </tmp/educacional-study2.pdf) -gt 750000
          test "$(head -c 5 /tmp/educacional-study2.pdf)" = '%PDF-'
          for n in {01..12}; do
            curl -fsSL "http://127.0.0.1:4173/estudos/analise-quantitativa-put-spreads-0-dte/slide-$n.webp" -o "/tmp/educacional-study2-$n.webp"
            test $(wc -c <"/tmp/educacional-study2-$n.webp") -gt 25000
            test "$(head -c 4 "/tmp/educacional-study2-$n.webp")" = 'RIFF'
          done
          if grep -Eiq 'Instalar app|appdeploy' /tmp/prime-latest.html; then echo 'Banner/AppDeploy no site'; exit 1; fi
      - name: Persistir package-lock no branch de migração
        if: github.event_name == 'push' && github.ref == 'refs/heads/migration/primesphere-vite-wrangler'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: atualizar lockfile da PrimeSphere [skip ci]'
            git push origin HEAD:migration/primesphere-vite-wrangler
          fi
