name: Validar PrimeSphere (sem publicar)

on:
  push:
    branches: [migration/primesphere-vite-wrangler]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Atualizar lockfile para dependências do site
        run: npm install --no-audit --no-fund
      - name: Build completo e deploy dry-run
        run: npm run check
      - name: Testar artefatos
        run: |
          test -f dist/client/index.html
          grep -q 'assets/' dist/client/index.html
          test -f src/react-app/editions/260925-afterclose.tsx
      - name: Persistir package-lock no branch de migração
        if: github.event_name == 'push' && github.ref == 'refs/heads/migration/primesphere-vite-wrangler'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: atualizar lockfile da PrimeSphere [skip ci]'
            git push origin HEAD:migration/primesphere-vite-wrangler
          fi
