name: Validar PrimeSphere (sem publicar)

on:
  push:
    branches: [migration/primesphere-vite-wrangler]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Atualizar lockfile para dependências do site
        run: npm ci --no-audit --no-fund
      - name: Build completo e deploy dry-run
        run: npm run check
      - name: Testar artefatos
        run: |
          test -f dist/client/index.html
          grep -q 'assets/' dist/client/index.html
          test -f src/react-app/editions/260925-afterclose.tsx
      - name: Verificar renderização real no Chrome
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/primesphere-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = '1' || { cat /tmp/primesphere-preview.log; exit 1; }
          chrome=$(command -v google-chrome || command -v chromium || true)
          test -n "$chrome" || { echo 'Chrome nao disponivel no runner'; exit 1; }
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/' >/tmp/prime-latest.html
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/?date=260917' >/tmp/prime-history.html
          grep -q 'AFTER CLOSE' /tmp/prime-latest.html
          grep -q '17/09/2026' /tmp/prime-history.html
          if grep -Eiq 'Instalar app|appdeploy' /tmp/prime-latest.html; then echo 'Banner/AppDeploy no site'; exit 1; fi
      - name: Persistir package-lock no branch de migração
        if: github.event_name == 'push' && github.ref == 'refs/heads/migration/primesphere-vite-wrangler'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: atualizar lockfile da PrimeSphere [skip ci]'
            git push origin HEAD:migration/primesphere-vite-wrangler
          fi
