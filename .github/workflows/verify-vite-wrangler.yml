name: Validar PrimeSphere (sem publicar)

on:
  push:
    branches: [main, migration/primesphere-vite-wrangler]
    paths-ignore:
      - "src/react-app/editions/*-afterclose.tsx"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build completo e deploy dry-run
        run: npm run check
      - name: Testar artefatos
        run: |
          set -euo pipefail
          test -f dist/client/index.html
          grep -q 'assets/' dist/client/index.html
          test -f src/react-app/editions/260925-afterclose.tsx
          test -f migrations/0001_auth.sql
          test -f src/worker/subscriber.ts
          test -f src/worker/protectedContent.ts
          test -f src/react-app/pages/AdminPage.tsx
      - name: Verificar renderização pública e gates de assinatura
        run: |
          set -Eeuo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/primesphere-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done

          chrome=$(command -v google-chrome || command -v chromium || true)
          test -n "$chrome"

          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/' >/tmp/home.html
          grep -q 'Morning Brief' /tmp/home.html
          grep -q '/educacional' /tmp/home.html
          grep -q '/trades' /tmp/home.html

          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/quem-somos' >/tmp/quem-somos.html
          grep -q 'Conteúdo em preparação' /tmp/quem-somos.html

          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/trades' >/tmp/trades.html
          grep -q 'Trading Logbook' /tmp/trades.html
          grep -q 'PÚBLICO · RM' /tmp/trades.html
          ! grep -Eq 'Área de assinantes|Criar administrador' /tmp/trades.html

          for route in /trades/EB /trades/DC; do
            safe=$(echo "$route" | tr '/' '_')
            timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom "http://127.0.0.1:4173$route" > "/tmp/$safe.html"
            grep -q 'Página não encontrada' "/tmp/$safe.html"
            ! grep -q 'Trading Logbook' "/tmp/$safe.html"
          done

          for route in /educacional /educacional/matematica-zero-dte; do
            safe=$(echo "$route" | tr '/' '_')
            timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom "http://127.0.0.1:4173$route" > "/tmp/$safe.html"
            grep -Eq 'Área de assinantes|Criar administrador' "/tmp/$safe.html"
          done

          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/' >/tmp/mobile.html
          grep -q 'Abrir menu' /tmp/mobile.html
          grep -q 'Wall Street, com contexto' /tmp/mobile.html

          if grep -Eiq 'Instalar app|appdeploy' /tmp/home.html; then
            echo 'Banner/AppDeploy no site'
            exit 1
          fi
      - name: Persistir package-lock no branch de migração
        if: github.event_name == 'push' && github.ref == 'refs/heads/migration/primesphere-vite-wrangler'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: atualizar lockfile da PrimeSphere [skip ci]'
            git push origin HEAD:migration/primesphere-vite-wrangler
          fi
