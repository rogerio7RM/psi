name: PrimeSphere V14 Offline QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/prime_v14_offline.py"
      - "tests/test_prime_v14_offline.py"
      - ".github/workflows/prime-v14-offline-qa.yml"
permissions:
  contents: read
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (offline, no paid API)
        run: python -m unittest discover -s tests -p 'test_prime_v14_offline.py' -v
      - name: Run audit if local dataset exists in repository
        shell: bash
        run: |
          if [ -f qa/fixtures/bigdata_raw_morning.json ]; then
            python scripts/prime_v14_offline.py qa/fixtures/bigdata_raw_morning.json --out qa-output
          else
            echo 'Dataset not committed; only synthetic unit tests were run.'
            python scripts/prime_v14_offline.py tests/fixtures/prime_v14_synthetic.json --out qa-output
          fi
      - name: Enforce fail-closed publication gate
        run: |
          python - <<'PY'
          import json
          gate=json.load(open('qa-output/gate.json'))
          assert gate['publication_allowed'] is False
          assert gate['certified_facts'] == 0
          print('Publication gate verified: BLOCKED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prime-v14-offline-qa
          path: qa-output/
